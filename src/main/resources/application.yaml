
spring:
  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vehicle_fuel_workflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    #show-sql: ${SHOW_SQL:true}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/helpdesk}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/helpdesk/protocol/openid-connect/certs}

workflow:
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:helpdesk}
    client-id: ${KEYCLOAK_CLIENT_ID:vehicle-workflow}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:vehicle-workflow-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  mail:
    # the mailbox notifications come from; defaults to the SMTP login
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    # Microsoft Graph (Office 365) instead of SMTP: an Entra app with the Mail.Send application permission
    graph:
      tenant-id: ${MAIL_GRAPH_TENANT_ID:}
      client-id: ${MAIL_GRAPH_CLIENT_ID:}
      client-secret: ${MAIL_GRAPH_CLIENT_SECRET:}
  notifications:
    # also copied on the HR & Admin approval emails; blank = only the HR users' own addresses
    hr-manager-email: ${HR_MANAGER_EMAIL:}
    it-department-email: ${IT_DEPARTMENT_EMAIL:}
    # the app's address, so emails link to the page; blank leaves the link out
    app-url: ${APP_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

# the mail health check logs in to SMTP on every health call; mail goes through Graph and is checked
# with the Send Test Email button instead
management:
  health:
    mail:
      enabled: false

server:
  port: ${PORT:8095}
